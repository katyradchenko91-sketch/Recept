<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Рецептов Сыровяленых и Сырокопченых Колбас</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-card: #252525;
            --primary: #ff5722;
            --accent: #ffb74d;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
        }

        /* Калькулятор */
        .calculator-global {
            background-color: var(--surface);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .calculator-global label {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .calculator-global input {
            background: #2c2c2c;
            border: 1px solid var(--primary);
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1.1rem;
            width: 120px;
        }

        /* Кнопки категорий */
        .categories-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Карточки */
        .recipes-grid {
            display: grid;
            gap: 20px;
        }

        .recipe-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .recipe-card:hover {
            border-color: var(--primary);
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
            gap: 10px;
        }

        .recipe-title {
            margin: 0;
            color: var(--primary);
            font-size: 1.4rem;
        }

        .meta-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            background: #333;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .tag.kopchenie { background: #4a2c00; color: #ffb74d; }
        .tag.vyalenie { background: #1b3a1e; color: #81c784; }
        .tag.fast { background: #3b1111; color: #ff8a80; }

        .section-title {
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #fff;
            border-left: 3px solid var(--primary);
            padding-left: 8px;
        }

        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 5px; }

        .val { color: var(--accent); font-weight: bold; }

        .tech-steps {
            background-color: #1a1a1a;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-top: 10px;
            border: 1px dashed #333;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .calculator-global { flex-direction: column; align-items: flex-start; }
            .recipe-header { flex-direction: column; }
        }
    </style>
</head>
<body>

    </header>

    <div class="calculator-global">

    </div>

    <!-- Переключатель категорий -->

function filterCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function render() {
    const weight = parseFloat(document.getElementById('weightInput').value) || 1;
    const container = document.getElementById('recipesContainer');
    container.innerHTML = '';

    const filtered = currentCategory === 'all' 
        ? recipes 
        : recipes.filter(r => r.category === currentCategory);

    filtered.forEach(r => {
        let card = document.createElement('div');
        card.className = 'recipe-card';

        let meatHtml = r.meat.map(m => {
            let val = (m.base * weight).toFixed(1);
            return `<li>${m.name}: <span class="val">${val} ${m.unit}</span></li>`;
        }).join('');

        let spicesHtml = r.spices.map(s => {
            let val = (s.base * weight).toFixed(1);
            return `<li>${s.name}: <span class="val">${val} ${s.unit}</span></li>`;
        }).join('');

        card.innerHTML = `
            <div class="recipe-header">
                <h2 class="recipe-title">${r.name}</h2>
                <div class="meta-badges">
                    <span class="tag ${r.type}">${r.typeText}</span>
                    ${r.category === 'fast_snacks' ? '<span class="tag fast">⚡ Быстрый срок</span>' : ''}
                    <span class="tag">📏 ${r.calibre}</span>
                    <span class="tag">⏳ ${r.time}</span>
                </div>
            </div>
            <div class="section-title">Состав сырья:</div>
            <ul>${meatHtml}</ul>
            <div class="section-title">Специи и добавки:</div>
            <ul>${spicesHtml}</ul>
            <div class="section-title">Технология:</div>
            <div class="tech-steps">${r.tech}</div>
        `;

        container.appendChild(card);
    });
}

// Первый запуск
